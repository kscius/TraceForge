# Production compose — Traefik (e.g. Cloudflare Tunnel) + optional loopback for smoke tests.
# Run from repo root:
#   docker compose -f deploy/host/docker-compose.prod.yml --env-file deploy/host/.env.production up -d --build
#
# Requires external Docker network `proxy` (demo-platform Traefik). Set TRACEFORGE_PUBLIC_HOST in .env.production.

name: traceforge-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: traceforge
    volumes:
      - traceforge_prod_pg:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://traceforge:${POSTGRES_PASSWORD}@db:5432/traceforge
    command: ["sh", "-c", "pnpm db:migrate:deploy && pnpm db:seed"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://traceforge:${POSTGRES_PASSWORD}@db:5432/traceforge
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/data/uploads}
    ports:
      - "127.0.0.1:14080:4000"
    networks:
      - internal
      - proxy
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.traceforge-api.rule=Host(`${TRACEFORGE_PUBLIC_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || Path(`/health`))
      - traefik.http.routers.traceforge-api.entrypoints=web
      - traefik.http.routers.traceforge-api.priority=100
      - traefik.http.routers.traceforge-api.service=traceforge-api
      - traefik.http.services.traceforge-api.loadbalancer.server.port=4000

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:13080:3000"
    networks:
      - proxy
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.traceforge-web.rule=Host(`${TRACEFORGE_PUBLIC_HOST}`)
      - traefik.http.routers.traceforge-web.entrypoints=web
      - traefik.http.routers.traceforge-web.priority=1
      - traefik.http.routers.traceforge-web.service=traceforge-web
      - traefik.http.services.traceforge-web.loadbalancer.server.port=3000

volumes:
  traceforge_prod_pg:

networks:
  proxy:
    external: true
    name: proxy
  internal:
    name: traceforge_prod_internal
    internal: true
